const sharedTurnover=15;
const plannedVisitEnd=job=>job.start+job.duration;
function visitEnd(job,now=Date.now()){
 const planned=plannedVisitEnd(job);
 if(!job.attendanceStartedAt)return planned;
 const midnight=clinicInstant(job.date);
 const end=Date.parse(job.attendanceEndedAt);
 if(Number.isFinite(end))return Math.max(planned,Math.ceil((end-midnight)/60000));
 const started=Date.parse(job.attendanceStartedAt);
 if(!Number.isFinite(started))return planned;
 const estimatedEnd=Math.max(planned,Math.ceil((started-midnight)/60000)+job.duration);
 // Depois da estimativa, o próximo horário só pode ser confirmado quando houver baixa.
 return now>=midnight+estimatedEnd*60000?Math.max(estimatedEnd,close):estimatedEnd;
}
const roomEnd=job=>visitEnd(job)+prepAfter;
function previousRoomVisit(job,jobs){
 return jobs.reduce((latest,other)=>
  other.room===job.room&&other.start<job.start&&(!latest||other.start>latest.start)?other:latest,null);
}
function roomStart(job,jobs){
 const standard=job.start-prepBefore;
 if(!job.room||!isAssistant(person(job.worker)))return standard;
 const previous=previousRoomVisit(job,jobs);

 return Math.max(standard,roomEnd(previous));
}

function gaps(room,jobs,rentals){

 for(const [start,end] of busy){if(start>cursor)result.push([cursor,Math.min(start,close)]);cursor=Math.max(cursor,end)}

}

function sterileProjection(candidate,now=Date.now()){
 const todayAtProjection=clinicDate(now);
 const jobs=state.jobs.filter(job=>job.id!==candidate?.id&&job.date>=todayAtProjection&&job.room&&awaitingPrep(job));
 if(candidate)jobs.push(candidate);
 jobs.sort((a,b)=>a.date.localeCompare(b.date)||a.start-b.start||a.id.localeCompare(b.id));
 const claimed=new Map(),needs=[];
 const packages=state.packs.slice().sort((a,b)=>a.valid.localeCompare(b.valid)||
  (a.validUntil||'').localeCompare(b.validUntil||'')||a.id.localeCompare(b.id));
 const released=packages.filter(pack=>availablePackage(pack,now));
 for(const job of jobs){
  const schedule=[...dayJobs(job.date).filter(entry=>entry.id!==candidate?.id),...(candidate?.date===job.date?[candidate]:[])];
  const deadline=clinicInstant(job.date,roomStart(job,schedule));

   const material=item(id);
   if(!materialAllowed(material,job))continue;
   const separated=job.discardSeparated?0:packages.filter(pack=>materialMatches(material,item(pack.item))&&pack.job===job.id&&pack.status==='Separado').length;
   const remaining=Math.max(0,qty-separated);
   const matches=released.filter(pack=>materialMatches(material,item(pack.item))&&!claimed.has(pack.id)&&availablePackage(pack,Math.max(now,deadline))).sort((a,b)=>Number(b.item===id)-Number(a.item===id)).slice(0,remaining);

}

function replenishmentEstimate(plan,now=Date.now()){

 const block=(state.sterilizationBlocks||[]).find(entry=>entry.id===plan.block&&!entry.cancelledAt);
 if(!block||person(block.worker)?.role!=='asb'||item(plan.item)?.kind!=='Pacote estéril'||
  ![plan.capacity,plan.preparation,plan.cycle,plan.release].every(value=>Number.isInteger(value)&&value>0))return null;
 const start=clinicInstant(block.date,block.start);
 const end=start+(plan.preparation+plan.cycle+plan.release)*60000;

function replenishmentCoverage(needs,now=Date.now()){

  .filter(entry=>entry.end!==null).sort((a,b)=>a.end-b.end);

  let covered=0;

   if(!materialMatches(item(need.id),item(forecast.plan.item))||forecast.end>need.deadline)continue;
   const allocated=Math.min(forecast.remaining,need.missing-covered);
   forecast.remaining-=allocated;
   covered+=allocated;
  }
  return [need,covered];
 }));
}

function groupedMaterialDemand(job,kind){

  const material=item(id);

  const key=materialFunctionKey(material);
  const entry=demand.get(key);

 }

}
function materialCapacity(material){

function consumableShortages(candidate,jobs){

  const reserved=jobs.filter(j=>j.status!=='Concluído').reduce((total,j)=>total+(groupedMaterialDemand(j,kind).get(key)?.qty||0),0);
  const free=Math.max(0,materialCapacity(material)-reserved);
  return free<qty?[material.name+' · Disponível: '+free+' · Solicitado: '+qty]:[];

}
function stockShortages(candidate,jobs){

function equipmentConflicts(candidate,jobs){
 const kind='Equipamento compartilhado';
 return [...groupedMaterialDemand(candidate,kind)].flatMap(([key,{material,qty}])=>{
  const busy=jobs.filter(j=>overlaps(candidate.start,visitEnd(candidate),j.start,visitEnd(j)))
   .map(job=>({job,qty:groupedMaterialDemand(job,kind).get(key)?.qty||0})).filter(entry=>entry.qty);
  const starts=[candidate.start,...busy.map(({job})=>Math.max(job.start,candidate.start))];
  const capacity=materialCapacity(material);
  return starts.some(t=>qty+busy.filter(({job})=>job.start<=t&&t<visitEnd(job))
   .reduce((total,entry)=>total+entry.qty,0)>capacity)?[material.name]:[];
 });

function materialFunctions(){

 const known=new Set(entries.map(entry=>patientKey(entry.label)));
 let next=entries.reduce((max,entry)=>Math.max(max,entry.number),0)+1;
 for(const material of state.items){
  const label=material.functionName?.trim();
  if(!label||known.has(patientKey(label)))continue;

}

function validateMaterial(row,index){
 const name=row.name.trim();
 const contents=(row.contents||'').trim();
 const qty=row.kind==='Pacote estéril'?0:Number(row.qty);
 if(!name||name.length>120)throw Error('Linha '+index+' · Informe um nome de até 120 caracteres.');
 if(!materialTypes.some(([kind])=>kind===row.kind))throw Error('Linha '+index+' · Escolha um tipo de item.');
 if(!Number.isSafeInteger(qty)||qty<0)throw Error('Linha '+index+' · Informe uma quantidade inteira igual ou maior que zero.');
 if(contents.length>1000)throw Error('Linha '+index+' · A composição ou os detalhes podem ter até 1.000 caracteres.');
 if(row.functionName!==undefined&&(typeof row.functionName!=='string'||row.functionName.length>120))throw Error('Função inválida.');
 if(row.hiddenInCatalog!==undefined&&typeof row.hiddenInCatalog!=='boolean')throw Error('Visibilidade inválida.');
 if(row.hiddenInCatalog&&!row.allowedDentist)throw Error('A visibilidade só pode ser alterada em itens exclusivos.');
 if(row.allowedDentist&&person(row.allowedDentist)?.role!=='dent')
  throw Error('Linha '+index+' · Escolha profissionais cadastrados para o uso restrito.');
 return {...row,name,qty,contents};
}
function saveMaterials(){
 if(!canEditMaterials())return;
 const previous=state.items;
 const previousAudit=state.audit.slice();
 try{
  const changes=materialDraftRows().flatMap((row,index)=>{
   const stored=item(row.id);
   if(!stored){
    if(!row.name.trim()&&!String(row.qty).trim()&&!row.contents?.trim())return [];
    const added={...row,allowedDentist:row.allowedDentist||''};
    if(!canEditMaterial(added))throw Error('Cadastre materiais apenas para seu próprio uso ou, como responsável técnico, para uso da clínica.');
    return [validateMaterial(added,index+1)];
   }
   const original=materialBaseline.get(row.id);
   const fields=['name','qty','contents','allowedDentist','hiddenInCatalog','functionName'].filter(key=>(key==='allowedDentist'?row[key]||'':row[key])!==(key==='allowedDentist'?original[key]||'':original[key]));
   if(!fields.length)return [stored];
   if(!canEditMaterial(stored)||fields.includes('allowedDentist'))throw Error('Você só pode editar os materiais sob sua responsabilidade.');
   const updated={...stored};
   for(const key of fields)updated[key]=row[key];
   return [validateMaterial(updated,index+1)];
  });
  state.items=changes;
  save('Catálogo atualizado',changes.length+' item(ns)');
  materialDraft=null;
  render();
  const feedback=$('material-feedback');
  if(feedback){
   feedback.className='material-save-success';
   feedback.textContent='✓ Alterações salvas.';
  }
 }catch(error){
  state.items=previous;
  state.audit=previousAudit;
  $('material-feedback').className='error';
  $('material-feedback').textContent=error.message;
 }
}

function inactiveAppointmentAlert(job){
 if(!job||!['Pendente','Confirmado','Reservado com pendência','Pronto'].includes(job.status)||job.attendanceStartedAt)return;
 const professionals=inactiveProfessionalsFor(job);
 if(!professionals.length)return;
 const signature=JSON.stringify(professionals.map(p=>[p.id,p.inactiveAt]).sort());
 const acknowledgment=job.inactiveProfessionalAcknowledgment;
 const acknowledged=acknowledgment?.signature===signature;
 if(job.date<today&&!acknowledged)return;
 const expiresAt=acknowledged?Date.parse(acknowledgment.at)+24*60*60*1000:NaN;
 return {job,professionals,signature,acknowledged,expiresAt};
}

function dialog(title,body,submit,handler){
 $('modal-body').innerHTML='<div class="bar"><h2 id="modal-title">'+esc(title)+'</h2>'+button('Fechar','dismiss')+'</div>'+(handler?'<form id="form">'+body+'<div class="error" role="alert" id="err"></div><div class="actions"><button class="primary" type="submit">'+esc(submit)+'</button></div></form>':body);

 if(handler)$('form').onsubmit=async e=>{
  e.preventDefault();
  const before=structuredClone(state), submitButton=e.target.querySelector('[type=submit]');
  submitButton.disabled=true;
  try{
   const data=new FormData(e.target);
   const command=sharedCommand;
   if(sharedMode&&command)command.steps.push([...data].map(([key,value])=>[key,typeof value==='string'?value:null]));
   try{if(!sharedMode)recordSterileShortages();await handler(data,e.target)}catch(error){if(sharedMode&&sharedCommand===command)command?.steps.pop();throw error}
  }catch(error){
   if(JSON.stringify(state)!==JSON.stringify(before)){
    state=before;
    render();
    if($('modal').open&&$('err'))$('err').textContent=error.message;
    else msg(error.message);
   }else if($('err'))$('err').textContent=error.message;
  }
  finally{submitButton.disabled=false}
 };
}

  const sum=[...cpf.slice(0,length)].reduce((total,digit,index)=>total+Number(digit)*(length+1-index),0);

}

 return schedule.filter(other=>other.id!==job.id&&other.attendanceStartedAt&&
  visitEnd(other)>plannedVisitEnd(other)&&(
   other.room===job.room&&overlapsRoomTime(job,other,schedule)||
   professionalConflicts(job,job.worker,[other],schedule).length||
   professionalConflicts(job,job.dent,[other],schedule).length));
}
function requireClearOfDelay(job){
 if(delayedVisitConflicts(job).some(other=>Date.now()<clinicInstant(other.date,roomEnd(other))))
  throw Error('A sala ou o profissional ainda está ocupado por um atendimento atrasado. Confira a agenda e ajuste o horário.');
}
function recordAttendance(id,ending){
 const job=state.jobs.find(j=>j.id===id);
 if(!canRecordAttendance(job)||Boolean(job.attendanceStartedAt)!==ending)return;
 const now=new Date().toISOString();
 if(ending){
  if(now<job.attendanceStartedAt)throw Error('O fim do atendimento deve ser posterior ao início.');
  job.attendanceEndedAt=now;
 }else{
  requireClearOfDelay(job);
  job.attendanceStartedAt=now;
  job.attendanceReservedMinutes=job.duration;
 }
 finish(ending?'Atendimento concluído':'Atendimento iniciado','Sala '+job.room);
 jobDetail(id);
}

function reprocessPackage(source,lot,code,valid,validTime){
 if(!steril()||!source||!['Usado','Aguardando reprocessamento'].includes(source.status)||
  source.reprocessedInto||!lot||lot.released||source.lot===lot.id)
  throw Error('Selecione um pacote elegível e uma nova carga aguardando liberação.');
 if(!code||!valid||valid<lot.date||state.packs.some(pack=>pack.code.toLowerCase()===code.toLowerCase()))
  throw Error('Informe um código novo e uma validade compatível com a nova carga.');
 const previousLot=state.lots.find(entry=>entry.id===source.lot);
 const priorActivity=source.usedAt||source.separatedAt;
 if((previousLot&&lotCycleTime(lot)<lotCycleTime(previousLot))||(priorActivity&&lotCycleTime(lot)<Date.parse(priorActivity)))
  throw Error('O ciclo da nova carga deve ocorrer depois da carga anterior e do uso ou separação registrados.');
 const pack={id:ids(),lot:lot.id,item:source.item,code,valid,contents:source.contents,preparedBy:actor,
  status:'Aguardando foto',validUntil:validTime?valid+'T'+validTime+':00-03:00':undefined,previousPack:source.id,previousLot:source.lot,previousJob:source.job||source.previousJob};
 source.reprocessedInto=pack.id;
 source.reprocessedAt=new Date().toISOString();
 source.reprocessedBy=actor;
 state.packs.push(pack);
 return pack;
}

function moveDay(by){
 if(calendarMode==='month'){
  const target=new Date(day.slice(0,7)+'-01T12:00:00Z');
  target.setUTCMonth(target.getUTCMonth()+by);
  const first=target.toISOString().slice(0,10);
  target.setUTCMonth(target.getUTCMonth()+1,0);
  day=shiftDate(first,Math.min(Number(day.slice(-2)),target.getUTCDate())-1);
 }else day=shiftDate(day,by*(calendarMode==='week'?7:1));
 render();
}

 if(e.target.id==='day'&&e.target.value){day=e.target.value;render()}
 if(e.target.dataset.material==='kind'&&canEditMaterials()){
  const tr=e.target.closest('tr');
  const index=materialDraftRows().findIndex(row=>row.id===tr.dataset.materialId);
  const row=materialDraftRows()[index];
  if(row){
   row.kind=e.target.value;
   if(row.kind==='Pacote estéril')row.qty='';
   tr.outerHTML=materialRow(row,index);
   $('material-rows').rows[index].querySelector('select').focus();
  }
 }
 if(e.target.id==='patient-dentist'){patientDentist=e.target.value;render();$('patient-dentist')?.focus()}
});
document.addEventListener('input',e=>{
 if(e.target.matches('[data-item-function-filter]')){
  for(const row of e.target.closest('fieldset').querySelectorAll('[data-item-function]'))
   row.hidden=Boolean(e.target.value&&row.dataset.itemFunction!==e.target.value);
 }

 if(e.target.dataset.material&&canEditMaterials()){
  const row=materialDraftRows().find(row=>row.id===e.target.closest('tr').dataset.materialId);
  if(row){
   row[e.target.dataset.material]=e.target.value;
   if(e.target.dataset.material==='allowedDentist')
    e.target.closest('tr').querySelector('[data-material-assistants]').textContent=materialAssistantLabel(row.allowedDentist);
  }
 }
 if(e.target.id==='trace-filter')document.querySelectorAll('.pack-row').forEach(r=>{r.hidden=!r.dataset.query.includes(e.target.value.trim().toLowerCase())});
 if(e.target.id==='patient-search'){
  const rows=[...document.querySelectorAll('.patient-row')];
  const query=e.target.value.trim();
  const byCPF=/^[\d.\-\s]+$/.test(query);
  for(const row of rows)row.hidden=byCPF?!row.dataset.cpf.includes(cpfDigits(query)):!row.dataset.name.includes(patientKey(query));
  $('patient-no-results').hidden=rows.length===0||rows.some(row=>!row.hidden);
 }
});
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b)return;
 const {action,id}=b.dataset;
 try{sharedAction(action,id)}catch(error){msg(error.message)}
});
function dispatch(action,id){
 switch(action){
 case 'booking':booking();break;
 case 'tab':tab=id;msg('');render();break;
 case 'dismiss':$('modal').close();break;
 case 'calendar-view':if(Object.hasOwn(calendarViews,id)){calendarMode=id;render()}break;
 case 'calendar-day':day=id;calendarMode='day';render();break;
 case 'prev':moveDay(-1);break;
 case 'next':moveDay(1);break;
 case 'today':day=today;render();break;
 case 'job':jobDetail(id);break;
 case 'edit-time':editAppointmentTime(id);break;
 case 'cleaning-new':requestCleaning();break;
 case 'cleaning-start':updateCleaning(id,'start');break;
 case 'cleaning-complete':updateCleaning(id,'complete');break;
 case 'cleaning-cancel':updateCleaning(id,'cancel');break;
 case 'patient-detail':patientDetail(id);break;
 case 'patient-note':addPatientNote(id);break;
 case 'patient-confirmation':confirmPatient(id);break;
 case 'validate':{
 const j=state.jobs.find(j=>j.id===id);
 if(canDecide(j))booking(j);
 break}
 case 'deny':denyRequest(id);break;
 case 'cancel-appointment':cancelAppointment(id);break;
 case 'rent':rental(id);break;
 case 'rental':{const r=state.rentals.find(r=>r.id===id);dialog('Aluguel reservado','<p>Sala '+r.room+' · '+clock(r.start)+'–'+clock(r.end)+(is('rt','reception')||actor===r.dent?' · '+esc(name(r.dent)):'')+'</p>');break}
 case 'prepare':prepareJob(id);break;
 case 'prep-configure':configurePreparation(id);break;
 case 'use':registerUse(id);break;
 case 'attendance-start':recordAttendance(id,false);break;
 case 'attendance-end':recordAttendance(id,true);break;
 case 'complete':{
 const j=state.jobs.find(j=>j.id===id);
 if(j.status!=='Em registro'||!(j.dent===actor||is('rt')))break;
 dialog('Concluir registro','<p>Confira se todos os pacotes usados têm as duas fotos anexadas.</p>','Concluir',()=>{
 if(!j.attendanceEndedAt)throw Error('O dentista responsável precisa registrar o início e marcar o atendimento como concluído.');
 if(state.packs.some(p=>p.job===id&&p.status==='Usado'&&(!p.photo1||!p.photo2)))throw Error('Anexe as duas fotos de todos os pacotes usados.');
 const supplies=Object.entries(j.items).filter(([key])=>item(key).kind==='Consumo');
 if(supplies.some(([key,qty])=>item(key).qty<qty))throw Error('Revise o estoque de consumo antes de concluir.');
 supplies.forEach(([key,qty])=>{item(key).qty-=qty});j.status='Concluído';finish('Registro concluído','Sala '+j.room);
 });break}
 case 'lot':newLot();break;
 case 'lot-detail':lotDetail(id);break;
 case 'pack':addPack(id);break;
 case 'pack-reprocess':sendPackageToNewLot(id);break;
 case 'replenishment-new':editReplenishment();break;
 case 'replenishment-edit':editReplenishment(id);break;
 case 'replenishment-remove':removeReplenishment(id);break;
 case 'sterile-day':if(steril()||is('dent')){day=id;render()}break;
 case 'pack-location':{
  const p=state.packs.find(p=>p.id===id);
  if(!steril()||p?.status!=='Disponível')break;
  dialog('Local de armazenamento · '+p.code,
   field('Armário, prateleira e caixa',input('location','text',p.location||'','required maxlength="120" placeholder="Ex. Armário A / Prateleira 2 / Caixa 03"')),
   'Salvar localização',data=>{
    const location=String(data.get('location')).trim();
    if(!location)throw Error('Informe o local de armazenamento.');
    p.location=location;finish('Local de armazenamento salvo',p.code);
   });break;
 }
 case 'pack-detail':packDetail(id);break;
 case 'photo1':addPhoto(id,1);break;
 case 'photo2':addPhoto(id,2);break;
 case 'release':{
 const lot=state.lots.find(l=>l.id===id);if(!steril()||!lot||lot.released)break;
 dialog('Liberar carga '+lot.code,'<label><span><input type="checkbox" name="checkedRelease" required> Conferi o monitoramento e os critérios do procedimento de liberação da clínica.</span></label>','Liberar carga',()=>{
 const packs=state.packs.filter(p=>p.lot===id);
 if(lotCycleTime(lot)>Date.now())throw Error('O ciclo desta carga está no futuro.');
 if(!packs.length||packs.some(p=>!p.photo1))throw Error('A carga precisa ter pacotes registrados com a foto pós-autoclave.');
 const releasedAt=Date.now();
 recordSterileShortages(releasedAt);
 lot.released=true;lot.releasedBy=actor;lot.releasedAt=new Date(releasedAt).toISOString();packs.forEach(p=>{p.status='Disponível'});finish('Carga liberada',lot.code);
 });break}
 case 'proc':editProcedure(id);break;
 case 'material-filter':
  if(materialFilters.some(([key])=>key===id)){materialFilter=id;render()}
  break;
 case 'material-add-many':
  if(canEditMaterials())dialog('Adicionar várias linhas',
   field('Quantidade de linhas',input('count','number',10,'min="1" max="200" step="1" required')),
   'Adicionar linhas',data=>{
    const count=Number(data.get('count'));
    if(!Number.isInteger(count)||count<1||count>200)throw Error('Informe de 1 a 200 linhas.');
    materialDraftRows().push(...Array.from({length:count},()=>newMaterial()));
    if(materialFilter==='clinic')materialFilter='mine';
    $('modal').close();
    render();
   });
  break;
 case 'material-add':
  if(canEditMaterials()){
   const rows=materialDraftRows();
   const row=newMaterial();
   rows.push(row);
   if(materialFilter==='clinic')materialFilter='mine';
   render();
   $('material-rows').lastElementChild.querySelector('input').focus();
  }
  break;
 case 'material-remove':
  if(canEditMaterials()&&!item(id)){materialDraft=materialDraftRows().filter(row=>row.id!==id);render()}
  break;
 case 'material-paste':pasteMaterials();break;
 case 'material-visibility':{
  const row=materialDraftRows().find(entry=>entry.id===id);
  if(is('dent')&&row?.allowedDentist===actor){
   row.hiddenInCatalog=!row.hiddenInCatalog;
   render();
  }
  break;
 }
 case 'material-function-add':addMaterialFunction();break;
 case 'material-save':saveMaterials();break;
 case 'assistant-access':editAssistantAccess();break;
 case 'sterilization-new':editSterilizationBlock();break;
 case 'sterilization-edit':editSterilizationBlock(id);break;
 case 'sterilization-cancel':cancelSterilizationBlock(id);break;
 case 'dental-scope':editDentalScope(id);break;
 case 'weekly-hours':editWeeklyHours(id);break;
 case 'team-directory':
 if(is('rt')){
  showInactiveProfessionals=id==='inactive';
  render();
  document.querySelector('[data-action="team-directory"][aria-pressed="true"]')?.focus();
 }
 break;
 case 'inactive-appointment-ack':acknowledgeInactiveAppointment(id);break;
 case 'report-absence':reportProfessionalAbsence(id||actor);break;
 case 'person-status':changeProfessionalStatus(id);break;
 case 'person':
 if(is('rt'))dialog('Novo profissional',field('Nome',input('name','text','','required'))+field('Função',select('role',Object.entries(roles)))+field('Categoria (para dentistas)',select('category',[['Prioritário','Prioritário'],['Contratante','Contratante']])),'Salvar profissional',d=>{
 const label=d.get('name').trim(),r=d.get('role');if(!label)throw Error('Informe o nome.');
 const professional={id:ids(),name:label,role:r,category:r==='dent'?d.get('category'):undefined};
 state.people.push(professional);
 finish('Profissional cadastrado',label);
 if(!sharedMode&&!serverReplay&&['dent','asb','tsb'].includes(r))editWeeklyHours(professional.id);
 });break;
 case 'grant':
 if(is('dent')&&['asb','tsb'].includes(person(id)?.role)){
 const before=structuredClone(state);const enabled=canBookFor(actor,id);
 state.grants[actor]=enabled?(state.grants[actor]||[]).filter(x=>x!==id):[...(state.grants[actor]||[]),id];
 try{save(enabled?'Autorização revogada':'Autorização concedida',name(id));render();msg(enabled?'Autorização revogada.':'Autorização concedida.')}catch(e){state=before;throw e}
 }break;
 case 'rules':
 if(is('rt'))dialog('Duração mínima para aluguel',field('Mínimo (minutos)',input('minimum','number',state.minRent,'min="15" max="480" required')),'Salvar',d=>{state.minRent=Number(d.get('minimum'));finish('Regra de aluguel atualizada',span(state.minRent))});break;
 }
}
function initializeSharedClinic(){
 $('actor').disabled=true;
 document.querySelector('label[for=actor]').textContent='Conta individual';
 $('mode-banner').textContent='Agenda e estoque compartilhados · '+location.host;
 function openClinic(){
  applySharedState(sharedRequest('/api/state'));
  $('shared-login').hidden=true;
  $('shared-logout').hidden=false;
  $('shared-import').hidden=sharedRole!=='rt';
  render();
 }
 try{openClinic()}catch{
  $('new').hidden=true;$('new-cleaning').hidden=true;
  function loginDialog(first=false){
   dialog(first?'Primeiro login':'Entrar na Clínica Fluxo',
    '<div class="actions"><button type="button" id="login-existing">Entrar</button> <button type="button" id="login-first">Primeiro login</button></div>'+
    (first?'<p>Digite seu nome como aparece na equipe e use a senha de teste 1234.</p>':'')+
    field(first?'Nome cadastrado':'Conta',input('username','text','','required autocomplete="username"'))+
    field('Senha',input('password','password','','required autocomplete="current-password"')),first?'Criar conta e entrar':'Entrar',data=>{
     sharedRequest('/api/login',{...Object.fromEntries(data),firstLogin:first?'yes':'no'});
     $('modal').close();openClinic();
    });
   $('login-existing').onclick=()=>loginDialog();
   $('login-first').onclick=()=>loginDialog(true);
  }
  $('shared-login').hidden=false;
  $('shared-login').onclick=()=>loginDialog();
  loginDialog();
 }
 $('shared-logout').onclick=()=>{sharedRequest('/api/logout',{});location.reload()};
 $('shared-import').onclick=()=>openSharedImport();
 setInterval(()=>{
  if(!sharedRole||$('modal').open||materialDraft)return;
  try{
   const snapshot=sharedRequest('/api/state');
   if(snapshot.revision!==sharedRevision||tab==='Agenda'||tab==='Esterilização'){applySharedState(snapshot);render()}
  }catch(error){msg(error.message)}
 },5000);
}
function openSharedImport(){
 dialog('Importar dados do navegador',
  '<p>Use os dados deste endereço ou um arquivo JSON exportado do navegador original. A origem será preservada.</p>'+
  '<label>Arquivo JSON (opcional)<input name="file" type="file" accept=".json,application/json"></label>',
  'Ver prévia',async data=>{
   const file=data.get('file');
   const raw=file?.size?await file.text():localStorage.getItem(storage);
   if(!raw)throw Error('Nenhum registro neste endereço. Exporte o JSON do navegador original e selecione o arquivo.');
   const snapshot=JSON.parse(raw);
   const preview=sharedRequest('/api/import/preview',{snapshot});
   const counts=Object.entries(preview.counts).map(([key,count])=>'<li>'+esc(key)+' · '+count+'</li>').join('');
   dialog('Prévia de importação','<p>'+esc(preview.message)+'</p><ul>'+counts+'</ul>',
    preview.allowed?'Importar':null,preview.allowed?()=>{
     applySharedState(sharedRequest('/api/import',{snapshot,revision:preview.revision,digest:preview.digest}));
     $('modal').close();render();msg('Importação concluída. Os dados de origem foram preservados.');
    }:null);
  });
}
// Browser initialization
const clickFeedbackTimers=new WeakMap();
document.addEventListener('click',event=>{
 const button=event.target.closest('button');
 if(!button||button.disabled)return;
 clearTimeout(clickFeedbackTimers.get(button));
 button.setAttribute('data-click-feedback','');
 clickFeedbackTimers.set(button,setTimeout(()=>button.removeAttribute('data-click-feedback'),220));
},true);
if(sharedMode)initializeSharedClinic();
else{
const originalBackup=localStorage.getItem(storage);
if(originalBackup){
 $('local-export').hidden=false;
 $('local-export').onclick=()=>{
  const url=URL.createObjectURL(new Blob([localStorage.getItem(storage)||originalBackup],{type:'application/json'}));
  const link=document.createElement('a');
  link.href=url;link.download='clinica-fluxo-backup.json';link.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
 };
}
updateWeeklyOpening();
refreshStockPendencies();
{
 const before=structuredClone(state);
 try{
  const released=resolveAssistantPriorities()+repairOverlappingAssistants();
  const restored=restoreDisplacedAssistants();
  if(released||restored)save('Escalas de auxiliares atualizadas','Prioridades e reatribuições');
 }catch(error){state=before;msg(error.message)}
}
render();
setInterval(()=>{
 if($('modal').open||materialDraft||localStorage.getItem(storage)!==savedSnapshot)return;
 const before=structuredClone(state);
 try{
  if(recordSterileShortages())save('Falta de material no prazo de preparo','Histórico de pacotes estéreis');
  if(tab==='Agenda'||tab==='Esterilização')render();
 }catch(error){state=before;msg(error.message)}
},5000);
}
